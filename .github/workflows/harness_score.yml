name: "AI Agent Harness Maturity Audit"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  harness-audit:
    name: "Audit Agentic Harness Maturity"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linters & Type Checks
        run: |
          python -m ruff check agentic/ || true
          python -m mypy agentic/ || true

      - name: Run Pytest Test Suite
        run: |
          pytest agentic/tests

      - name: Run Harness Score Audit
        uses: paladini/harness-score@v1
        with:
          min-level: "3"
          badge: "harness-badge.svg"
          report: "harness-report.md"
          comment: "true"
