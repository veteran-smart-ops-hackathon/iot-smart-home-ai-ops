[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-iot-multi-agent"
version = "0.1.0"
description = "Multi-Agent IoT Diagnostic & Action System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "qdrant-client>=1.6.4",
    "pika>=1.3.2",
    "paho-mqtt>=1.6.1",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic*", "rag*", "pre_progressor*", "rabbitmq*", "machine_learning*", "backend*"]
exclude = ["frontend*", "database*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["agentic/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
